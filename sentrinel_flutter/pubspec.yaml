name: sentrinel
description: >-
  Sentrinel client for Flutter and Dart. Records every outgoing request, error
  and crash from your app, and propagates W3C traceparent so a mobile call and
  the backend request it triggers land on one timeline.
version: 0.1.0
repository: https://github.com/Zaga-ltd/sentinel_packages
homepage: https://sentrinel.dev

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  http: ^1.2.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
