[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentrinel-fastapi"
version = "0.1.0"
description = "Sentrinel for FastAPI and Starlette — requests, errors, logs, traces and metrics, from one ASGI middleware."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Sentrinel" }]
keywords = ["fastapi", "starlette", "asgi", "monitoring", "observability", "apm", "sentrinel"]
classifiers = [
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Monitoring",
]

# No runtime dependencies on purpose.
#
# A monitoring library is installed into somebody else's dependency tree, and
# every package it drags in is a version it can conflict with. Everything here
# is standard library; FastAPI and Starlette are the host, not dependencies to
# pin. httpx and requests are used only if your code already uses them.
dependencies = []

[project.optional-dependencies]
# FastAPI 0.100 (Starlette 0.27) is the oldest version tested.
dev = ["fastapi>=0.100", "httpx>=0.24", "pytest>=7"]

[project.urls]
Documentation = "https://docs.sentrinel.dev/reference/fastapi/"
Source = "https://github.com/Zaga-ltd/sentinel_packages"

[tool.hatch.build.targets.wheel]
packages = ["sentrinel_fastapi"]
