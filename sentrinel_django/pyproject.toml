[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentrinel-django"
version = "0.1.0"
description = "Sentrinel for Django — requests, errors, logs, traces and metrics, from one middleware."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Sentrinel" }]
keywords = ["django", "monitoring", "observability", "apm", "sentrinel"]
classifiers = [
  "Framework :: Django",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Monitoring",
]

# No runtime dependencies on purpose.
#
# A monitoring library is installed into somebody else's dependency tree, and
# every package it drags in is a version it can conflict with. Everything here
# is standard library; Django itself is the host, not a dependency to pin.
dependencies = []

[project.optional-dependencies]
# Django 3.1 is the oldest version tested; the package uses nothing newer.
dev = ["django>=3.1", "pytest>=7"]

[project.urls]
Documentation = "https://docs.sentrinel.dev/reference/django/"
Source = "https://github.com/Zaga-ltd/sentinel_packages"

[tool.hatch.build.targets.wheel]
packages = ["sentrinel_django"]
